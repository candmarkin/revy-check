[package]
name = "revy-check"
version = "0.1.0"
edition = "2021"

[dependencies]
egui = "0.30"
eframe = { version = "0.30", default-features = true, features = ["default_fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
mysql = "25.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
cpal = "0.15"
hound = "3.5"
dasp_signal = "0.11"
dasp_sample = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["fs"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
