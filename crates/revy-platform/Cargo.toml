[package]
name = "revy-platform"
version.workspace = true
edition.workspace = true

# OS-abstraction layer. Traits live in `api`, the concrete implementation is
# selected at compile time. Phase 1 ships only `MockPlatform`; the real Linux
# (sysfs/CLI) and Windows (WMI/WinAPI) impls land in Phases 2 and 3, which is
# where the target-specific dependencies below get uncommented.
[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
log = "0.4"
chrono = "0.4"

# Phase 2 (Linux): clock_settime replaces the `sudo date` shell-out.
